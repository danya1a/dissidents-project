      pointer-events: none;

    a {

      text-decoration: none;

    button {

      border: none;
      background: none;

    .btn-secondary {

    /* Цензурований текст */

      display: none;
      align-items: center;
      justify-content: center;

      max-height: 90vh;

      flex-direction: column;
      border: 1px solid var(--border-warm);
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

    /* Утиліти відступів і кольорів */

    .p-6 { padding: 1.5rem; }

    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mb-10 { margin-bottom: 2.5rem; }

    .mt-2 { margin-top: 0.5rem; }

    .text-xs { font-size: 0.775rem; }
    .text-sm { font-size: 0.895rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.275rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-crimson { color: var(--crimson); }
    .text-navy { color: var(--navy); }

    .font-bold { font-weight: 700; }

</head>

  <script>
    // ================= 1. ЗАХИСТ ДОМЕНУ ТА ДИНАМІЧНИЙ МОНТАЖ DOM =================
    (function () {
      const _0xHosts = [
        atob('ZGFueWExYS5naXRodWIuaW8='), // danya1a.github.io
        atob('bG9jYWxob3N0'),             // localhost
        atob('MTI3LjAuMC4x')              // 127.0.0.1
      ];

      const host = (window.location.hostname || '').toLowerCase();
      const path = (window.location.pathname || '').toLowerCase();
      const proto = window.location.protocol;

      const isMyGithub =
        host === _0xHosts[0] &&
        (path.startsWith('/dissidents-project') || path === '/');
      const isLocalDev =
        host === _0xHosts[1] ||
        host === _0xHosts[2] ||
        host.endsWith('.googleusercontent.com');

      const ua = (navigator.userAgent || '').toLowerCase();
      const isClonerBot =
        navigator.webdriver === true ||
        /saveweb2zip|httrack|webcopy|wget|curl|python|scrapy|headless|phantomjs|puppeteer|playwright/i.test(ua);

      if (proto === 'file:' || isClonerBot || (!isMyGithub && !isLocalDev)) {

        try { window.stop(); } catch (e) {}

      // Блокування гарячих клавіш і правого кліку

        const k = e.key ? e.key.toLowerCase() : '';
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(k)) ||
          (e.ctrlKey && ['u', 's', 'p'].includes(k)) ||
          (e.metaKey && e.altKey && ['i', 'j', 'u', 'c'].includes(k))
        ) {
          e.preventDefault();
          e.stopPropagation();
          return false;

          <div id="mobileMenu" class="mobile-menu-panel">

            <a href="#thaw" class="mobile-link">1. Історія відлиги та хронологія</a>
            <a href="#voices" class="mobile-link">2. Голоси дисидентів (Персоналії)</a>

        <main>

        : 'Розкрити цензуровані фрагменти в текстах';
    }

    function openSourceModal(index) {
      const src = historicalSources[index];
      const fallbackImg = createFallbackDocumentImg(src.code, src.date.split('(')[0].trim());
      document.getElementById('modalSourceType').textContent = `${src.code} • ${src.type}`;
      document.getElementById('modalSourceTitle').textContent = src.title;
      document.getElementById('modalSourceBody').innerHTML = `
        <div style="border-radius:12px; overflow:hidden; border:1px solid var(--border-warm); height:200px; background:var(--paper-dark);">
          <img src="${src.image}" alt="${src.title}" onerror="this.onerror=null;this.src='${fallbackImg}';" style="width:100%; height:100%; object-fit:cover; filter:grayscale(100%);" />

        <div class="grid-2 p-4 text-xs" style="background:var(--paper); border-radius:10px; border:1px solid var(--border-warm);">
          <div><span class="text-muted" style="display:block;">Дата створення / публікації:</span><strong>${src.date}</strong></div>

        </div>

          <h4 class="font-serif font-bold text-base mb-1">Цитований уривок (без купюр цензури):</h4>

            ${src.excerpt.replace(/class="redacted-text"/g, 'class="redacted-text revealed"')}
          </blockquote>
        </div>
        <div>
          <h4 class="font-serif font-bold text-base mb-1">Як дисиденти поширювали інформацію:</h4>
          <p class="text-muted">${src.spreadMethod}</p>
        </div>
        <div>
          <h4 class="font-serif font-bold text-base text-crimson mb-1">Реакція радянської влади та КДБ:</h4>
          <p class="text-muted">${src.regimeReaction}</p>
        </div>
      `;
      document.getElementById('sourceModal').classList.add('open');
    }

    function closeSourceModal() {
      document.getElementById('sourceModal').classList.remove('open');
    }

    function renderCyberCases(activeIdx = 0) {
      const listEl = document.getElementById('cyberTabsList');
      const detailEl = document.getElementById('cyberCaseDetail');

      listEl.innerHTML = cyberCases.map((c, idx) => {
        const active = idx === activeIdx;
        return `
          <button
            onclick="renderCyberCases(${idx})"
            style="width:100%; text-align:left; padding:1rem; border-radius:12px; border:1px solid ${active ? 'var(--ink)' : 'var(--border-warm)'}; background:${active ? 'var(--ink)' : '#fff'}; color:${active ? '#fff' : 'var(--ink)'}; display:flex; align-items:flex-start; gap:0.85rem; transition:all 0.2s;">
            <span class="font-mono text-xs font-bold" style="padding:4px 8px; border-radius:6px; background:${active ? 'var(--crimson)' : 'var(--paper-dark)'}; color:${active ? '#fff' : 'var(--ink-muted)'};">${String(idx + 1).padStart(2, '0')}</span>
            <div>
              <div class="font-mono text-xs" style="text-transform:uppercase; color:${active ? 'rgba(248,246,241,0.7)' : 'var(--crimson)'};">${c.category}</div>
              <div class="font-serif font-bold text-base" style="margin-top:2px;">${c.title}</div>
            </div>
          </button>
        `;
      }).join('');

      const item = cyberCases[activeIdx];
      detailEl.innerHTML = `
        <div class="flex-between mb-4" style="padding-bottom:1rem; border-bottom:1px solid var(--border-warm);">
          <div>
            <span class="section-kicker" style="margin-bottom:2px;">${item.num} • ${item.category}</span>
            <h3 class="font-serif text-2xl font-bold">${item.title}</h3>
          </div>
          <span class="pill-badge font-mono">Кейс ${activeIdx + 1} / ${cyberCases.length}</span>
        </div>

        <div class="text-sm" style="display:flex; flex-direction:column; gap:1.1rem;">
          <div class="p-4" style="background:var(--paper); border-radius:10px; border:1px solid var(--border-warm);">
            <div class="font-mono text-xs text-muted font-semibold mb-1" style="text-transform:uppercase;">Опис цифрової ситуації:</div>
            <p>${item.scenario}</p>
          </div>

          <div class="grid-2">
            <div class="p-4" style="background:var(--crimson-light); border-radius:10px; border:1px solid rgba(158,42,43,0.2);">

            </div>
          </div>

          <div>
            <div class="font-mono text-xs font-semibold mb-2" style="color:var(--emerald-text); text-transform:uppercase;">Правила безпечної поведінки та алгоритм дій:</div>
            <div style="display:flex; flex-direction:column; gap:0.5rem;">
              ${item.actionRules.map(rule => `
                <div style="display:flex; align-items:flex-start; gap:0.6rem;">
                  <span style="width:20px; height:20px; border-radius:999px; background:var(--emerald-bg); color:var(--emerald-text); font-size:0.75rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;">✓</span>
                  <span>${rule}</span>
                </div>
              `).join('')}

          </div>

    // ================= 7. ЗАПУСК ІНТЕРАКТИВНИХ МОДУЛІВ =================
    (function initApp() {
      if (!document.getElementById('eraContent')) return;

      switchEra('1965');
      renderTimeline(0);
      renderDissidents();
      renderSources();
      renderCyberCases(0);

      const mobileBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('open');
        });
        document.querySelectorAll('.mobile-link').forEach(link => {
          link.addEventListener('click', () => mobileMenu.classList.remove('open'));
        });
      }

      const modal = document.getElementById('sourceModal');
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeSourceModal();
        });
      }
    })();
  </script>
