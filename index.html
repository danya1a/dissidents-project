            </button>
          </div>
        </article>
      `}).join('');

      if (allRedactionsRevealed) {
        document.querySelectorAll('.redacted-text').forEach(el => el.classList.add('revealed'));
      }
    }

    function toggleSingleRedaction(e) {
      if (e.target && e.target.classList.contains('redacted-text')) {
        e.target.classList.toggle('revealed');
      }
    }

    function toggleAllRedactions() {
      allRedactionsRevealed = !allRedactionsRevealed;
      const elements = document.querySelectorAll('.redacted-text');
      elements.forEach(el => {
        if (allRedactionsRevealed) {
          el.classList.add('revealed');
        } else {
          el.classList.remove('revealed');
        }
      });
      const btnText = document.getElementById('redactionBtnText');
      btnText.textContent = allRedactionsRevealed
        ? 'Приховати цензуровані фрагменти'
        : 'Розкрити цензуровані фрагменти в текстах';
    }

    function openSourceModal(index) {
      const src = historicalSources[index];
      const fallbackImg = createFallbackDocumentImg(src.code, src.date.split('(')[0].trim());
      document.getElementById('modalSourceType').textContent = `${src.code} • ${src.type}`;
      document.getElementById('modalSourceTitle').textContent = src.title;
      document.getElementById('modalSourceBody').innerHTML = `
        <div class="rounded-xl overflow-hidden border border-borderWarm bg-paperDark h-52">
          <img src="${src.image}" alt="${src.title}" onerror="this.onerror=null;this.src='${fallbackImg}';" class="w-full h-full object-cover grayscale" />

        <div class="grid sm:grid-cols-2 gap-3 bg-paper p-4 rounded-xl border border-borderWarm text-xs">

        </div>
        <div>
          <h4 class="font-serif font-bold text-base text-ink mb-1">Цитований уривок (без купюр цензури):</h4>

            ${src.excerpt.replace(/class="redacted-text"/g, 'class="redacted-text revealed"')}
          </blockquote>
        </div>
        <div>
          <h4 class="font-serif font-bold text-base text-ink mb-1">Як дисиденти поширювали інформацію:</h4>

        </div>
        <div>

          <p class="text-inkMuted">${src.regimeReaction}</p>
        </div>
      `;
      const modal = document.getElementById('sourceModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSourceModal() {
      const modal = document.getElementById('sourceModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // ================= ІНІЦІАЛІЗАЦІЯ =================
    document.addEventListener('DOMContentLoaded', () => {
      if (!document.getElementById('eraContent')) return;

      switchEra('1965');
      renderTimeline(0);
      renderDissidents();
      renderSources();
      renderCyberCases(0);

      const mobileBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
        document.querySelectorAll('.mobile-link').forEach(link => {
          link.addEventListener('click', () => mobileMenu.classList.add('hidden'));
        });
      }

      const modal = document.getElementById('sourceModal');
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeSourceModal();
        });
